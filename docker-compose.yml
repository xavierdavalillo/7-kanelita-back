services:
  postgres:
    image: postgres:16-alpine
    container_name: kanelita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanelita
      POSTGRES_USER: kanelita
      POSTGRES_PASSWORD: kanelita_password
    ports:
      - "5433:5432"
    volumes:
      - kanelita-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanelita -d kanelita"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kanelita-postgres-data:
